name: Update README Stats

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:  # Allows manual trigger
  push:
    branches:
      - main

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card (dark)
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate stats card (light)
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=default
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate top languages card (dark)
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=radical
          path: profile/top-langs-dark.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate top languages card (light)
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=default
          path: profile/top-langs-light.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate cdat-pattern pin card
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: pin
          options: username=dar-kow&repo=cdat-pattern&theme=radical&description_lines_count=3
          path: profile/pin-cdat-pattern.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate demo-bi pin card
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: pin
          options: username=dar-kow&repo=demo-bi&theme=radical&description_lines_count=3
          path: profile/pin-demo-bi.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate M-A-F pin card
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: pin
          options: username=dar-kow&repo=M-A-F&theme=radical&description_lines_count=3
          path: profile/pin-maf.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate Portfolio pin card
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: pin
          options: username=dar-kow&repo=Portfolio&theme=radical&description_lines_count=3
          path: profile/pin-portfolio.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate maf-e2e-pw pin card
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: pin
          options: username=dar-kow&repo=maf-e2e-pw&theme=radical&description_lines_count=3
          path: profile/pin-maf-e2e-pw.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate k6-dashboard pin card
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: pin
          options: username=dar-kow&repo=k6-dashboard&theme=radical&description_lines_count=3
          path: profile/pin-k6-dashboard.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate activity calendar (light)
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.STATS_PAT }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/Warsaw
          extras_css: |
            h2{font-size:13px}h3,svg{font-size:11px}
          filename: profile/activity-light.svg
          output_action: none

      - name: Generate activity calendar (dark)
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.STATS_PAT }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/Warsaw
          extras_css: |
            :root{--color-calendar-graph-day-bg:#161b22;--color-calendar-graph-day-border:rgba(240,246,252,0.1);--color-calendar-graph-day-L1-bg:#0e4429;--color-calendar-graph-day-L2-bg:#006d32;--color-calendar-graph-day-L3-bg:#26a641;--color-calendar-graph-day-L4-bg:#39d353}
            svg{color:#c9d1d9}h2,h3{color:#58a6ff}
            h2{font-size:13px}h3,svg{font-size:11px}
          filename: profile/activity-dark.svg
          output_action: none

      - name: Copy activity calendar
        run: cp /metrics_renders/profile/activity-light.svg /metrics_renders/profile/activity-dark.svg profile/

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch profile/stats.svg profile/top-langs.svg profile/activity.svg
          git add profile/*.svg
          git commit -m "chore: update README stats cards" || exit 0
          git push
